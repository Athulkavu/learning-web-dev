<!DOCTYPE html>
<html lang="en">
<head>
   
    <title></title>
</head>
<body>
    <script src="./redux.js"></script>
    <script>
        // create a store
        const {createStore,combineReducers}=Redux;
        // count action 
        // increment action
        // const increment={
        //     type:'INCREMENT'
        // }
        // increment action creator instead of action create above 
        const increment=()=>{
            return{
            type:'INCREMENT'
        }}
        // decrement action creator
        const decrement=()=>{
            return{
            type:'DECREMENT'
        }}
         // reset action creator
        const reset=()=>{
            return{
            type:'RESET'
        }}
        // incrementBy action creator
         const incrementBy=(n)=>{
            return{
            type:'INCREMENT_BY',
            payload:n
        }}

        //countReducer
        const countInitialState=0;
        const countReducer=(state = countInitialState,action) => {
            if(action.type==='INCREMENT'){
                return state+1;
            }
            else if(action.type=='DECREMENT'){
                return state-1;
            }
             else if(action.type=='RESET'){
                return countInitialState;
            }
             else if(action.type=='INCREMENT_BY'){
                return state+action.payload;
            }

            else{
            return state;
            }
        }

        const store=createStore(combineReducers({
            count:countReducer
        }));
        console.log(store);
        console.log(store.getState());

        store.subscribe(()=>{
            console.log(store.getState()); 
        })

        // store.dispatch(increment);//or store.dispatch({type:'INCREMENT'})
        // console.log(store.getState()); 
        // store.dispatch(increment);
        store.dispatch(increment());
        store.dispatch(increment());
        store.dispatch(decrement());
        store.dispatch(reset());
        store.dispatch(incrementBy(10));


    </script>
</body>
</html>

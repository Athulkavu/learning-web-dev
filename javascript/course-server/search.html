<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Search Page</h1>
    <form onsubmit="handleSubmit(event)">
        <label>Enter Course title</label>
        <input type="text" id="course-title" />
        <input type="submit" />
    </form>
    <ul id="list"></ul>
    <script>
        const ulTagHandle = document.getElementById('list')
        // document.body.appendChild(Object.assign(document.createElement('h2'), { id: 'cd', textContent: 'd' }));
        // another way for the above
        // const newH2 = document.createElement('h2');
        // newH2.id = 'cd';
        // newH2.textContent = 'd';
        // document.body.appendChild(newH2);
        const h2Tag = document.createElement('h2');
        const handleSubmit = (event) => {
            event.preventDefault();
            const title = document.getElementById("course-title").value;
            // console.log("form submitted with",title);
            const url = "http://localhost:4000/courses/search?title=" + title;
            console.log(url);
            const xhr = new XMLHttpRequest();
            xhr.open("GET", url);
            xhr.send();

            xhr.onload = function () {
                ulTagHandle.innerHTML = "";
                const result = JSON.parse(xhr.responseText);
                console.log(result.length);

                for (let course of result) {
                    const liTag = document.createElement('li');
                    liTag.textContent = `${course.title}, ${course.category}`;
                    ulTagHandle.appendChild(liTag);
                }

                h2Tag.textContent = "length=" + result.length;
                //  h2Tag.id='status-tag';
                //  document.body.appendChild(h2Tag);
                ulTagHandle.insertAdjacentElement('afterend', h2Tag);

            }

        }
    </script>
</body>

</html>
